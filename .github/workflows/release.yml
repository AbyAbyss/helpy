# Builds installers and attaches them to a GitHub Release.
# Runs only when a release is published on the Releases page, or when started by
# hand (Actions → Release → Run workflow) with a version such as 0.2.0; never on
# ordinary pushes, merges or bare tag pushes.
# The installers take their version from the release's tag (v0.2.0 → 0.2.0) or
# from the version typed in. A manual run creates the tag v<version> on the
# chosen branch if it doesn't exist yet, and publishes a release for it.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 0.2.0"
        required: true
  release:
    types: [published]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
        run: |
          version="${TAG:-$INPUT}"
          version="${version#v}"
          # Windows installers only take plain numbers, so no -beta suffixes.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::\"$version\" isn't a version like 1.2.3"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG:-v$version}" >> "$GITHUB_OUTPUT"

      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          BODY: |
            Unsigned builds. On macOS, open Helpy once, then allow it under System Settings →
            Privacy & Security → Open Anyway; if macOS says the app is damaged, run
            `xattr -dr com.apple.quarantine /Applications/Helpy.app`. On Windows, choose
            More info → Run anyway. See the README for setup.
        run: |
          if [ -z "$RELEASE_ID" ]; then
            if ! gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2>&1; then
              gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
            fi
            RELEASE_ID=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .id 2> /dev/null) ||
              RELEASE_ID=$(gh api "repos/$GH_REPO/releases" -f tag_name="$TAG" -f name="Helpy $VERSION" -f body="$BODY" --jq .id)
          fi
          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon
          - os: windows-latest
          - os: ubuntu-24.04 # 22.04's PipeWire is too old for the screen-capture bindings
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - name: Version from the release
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node -e '
            const fs = require("fs"), f = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.version = process.env.VERSION;
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n");
          '

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libpipewire-0.3-dev libclang-dev \
            libasound2-dev libspeechd-dev cmake libxtst-dev libgbm-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
