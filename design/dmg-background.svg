<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="1320" height="840">
  <!-- The disk image window: Helpy's icon sits on the left pad, the
       Applications folder on the right (positions are in tauri.conf.json). -->
  <defs>
    <radialGradient id="coral" cx="0.27" cy="0.48" r="0.42">
      <stop offset="0" stop-color="#F0544F" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#F0544F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="0.73" cy="0.48" r="0.42">
      <stop offset="0" stop-color="#5B9CF5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5B9CF5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0544F"/>
      <stop offset="1" stop-color="#5B9CF5"/>
    </linearGradient>
  </defs>
  <rect width="660" height="420" fill="#1B2030"/>
  <rect width="660" height="420" fill="url(#coral)"/>
  <rect width="660" height="420" fill="url(#blue)"/>

  <!-- Pads under the two icons -->
  <circle cx="180" cy="200" r="88" fill="#FFFFFF" fill-opacity="0.045"/>
  <circle cx="180" cy="200" r="88" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="480" cy="200" r="88" fill="#FFFFFF" fill-opacity="0.045"/>
  <circle cx="480" cy="200" r="88" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- A bouncing dotted hop from the app to the folder -->
  <path d="M270 190 C 305 120, 355 120, 392 188" fill="none" stroke="url(#fade)" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 15"/>
  <path d="M380 166 L394 190 L368 192" fill="none" stroke="#5B9CF5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="330" y="322" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" fill-opacity="0.92" letter-spacing="-0.2">Drop Helpy into Applications</text>
  <text x="330" y="346" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" fill-opacity="0.55">Then eject this disk and open Helpy from Launchpad.</text>

  <!-- Helpy peeking in from the bottom-left corner -->
  <g transform="translate(14 362) scale(1.25)">
    <path d="M6 6 L26 13.5 A22 22 0 1 1 13.5 26 Z" fill="#F0544F"/>
    <ellipse cx="30" cy="33" rx="3.2" ry="4.4" fill="#1B2030"/>
    <ellipse cx="42" cy="33" rx="3.2" ry="4.4" fill="#1B2030"/>
    <ellipse cx="31" cy="31.5" rx="1" ry="1.3" fill="#FFFFFF" fill-opacity="0.8"/>
    <ellipse cx="43" cy="31.5" rx="1" ry="1.3" fill="#FFFFFF" fill-opacity="0.8"/>
  </g>
</svg>
